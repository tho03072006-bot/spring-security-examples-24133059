<!DOCTYPE html>
<!-- Layout ghép bằng fragment giống vd3.pdf: head(title) và page(content) -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | IOTSTAR SHOP'}">IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:fragment="page(content)">
    <header th:replace="~{fragments/header :: header}"></header>
    <main>
        <!-- Thông báo flash từ controller -->
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <th:block th:replace="${content}"></th:block>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
