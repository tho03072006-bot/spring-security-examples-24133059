<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::section})}">
    <section>
        <div class="auth-card">
            <h1>Quên mật khẩu</h1>
            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" required>
                <small class="error-text" th:errors="*{email}"></small>

                <button class="full" type="submit">Gửi OTP</button>
            </form>
            <p><a th:href="@{/login}">Quay lại đăng nhập</a></p>
        </div>
    </section>
</div>
</body>
</html>
