<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::section})}">
    <section>
        <div class="auth-card">
            <h1>Xác nhận OTP</h1>
            <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
                <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" required>
                <small class="error-text" th:errors="*{email}"></small>

                <label for="otp">OTP 6 chữ số</label>
                <input id="otp" type="text" th:field="*{otp}" maxlength="6" inputmode="numeric" required>
                <small class="error-text" th:errors="*{otp}"></small>

                <button class="full" type="submit">Xác nhận</button>
            </form>

            <!-- Gửi lại OTP: mã cũ bị vô hiệu hóa -->
            <form th:action="@{/resend-register-otp}" method="post">
                <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                <button class="secondary full" type="submit">Gửi lại OTP</button>
            </form>
            <p class="note">OTP hết hạn sau 5 phút. Chờ 60 giây giữa hai lần gửi.</p>
            <p><a th:href="@{/login}">Quay lại đăng nhập</a></p>
        </div>
    </section>
</div>
</body>
</html>
