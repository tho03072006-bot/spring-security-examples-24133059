<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đăng ký')}"></head><body><div th:replace="~{layouts/layout :: page(~{::section})}"><section><div class="auth-card"><h1>Đăng ký</h1><form th:action="@{/register}" th:object="${registerDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err:${#fields.globalErrors()}" th:text="${err}"></p></div><label for="username">Username</label><input id="username" type="text" th:field="*{username}" required ><small class="error-text" th:errors="*{username}"></small><label for="email">Email</label><input id="email" type="email" th:field="*{email}" required ><small class="error-text" th:errors="*{email}"></small><label for="fullName">Họ tên</label><input id="fullName" type="text" th:field="*{fullName}" required ><small class="error-text" th:errors="*{fullName}"></small><label for="password">Mật khẩu</label><input id="password" type="password" th:field="*{password}" required ><small class="error-text" th:errors="*{password}"></small><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required ><small class="error-text" th:errors="*{confirmPassword}"></small><button class="full">Đăng ký và nhận OTP</button></form><p><a th:href="@{/login}">Quay lại đăng nhập</a></p></div></section></div></body></html>
