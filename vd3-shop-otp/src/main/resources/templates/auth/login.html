<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head><body><div th:replace="~{layouts/layout :: page(~{::section})}"><section><div class="auth-card"><p class="eyebrow">VÍ DỤ 3 / SPRING SECURITY</p><h1>Đăng nhập</h1><div class="alert error" th:if="${param.error}">Thông tin đăng nhập không đúng hoặc tài khoản chưa được kích hoạt.</div><div class="alert success" th:if="${param.logout}">Đã đăng xuất thành công.</div><div class="alert error" th:if="${param.expired}">Phiên đăng nhập đã hết hạn.</div><div th:if="${success}" class="alert success" th:text="${success}"></div><form th:action="@{/login}" method="post"><label for="username">Username</label><input id="username" name="username" required autofocus autocomplete="username" type="text"><label for="password">Mật khẩu</label><input id="password" type="password" name="password" autocomplete="current-password" required><button class="full">Đăng nhập</button></form><p><a th:href="@{/register}">Tạo tài khoản</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p><p class="note">Tài khoản mẫu: admin / 123456</p></div></section></div></body></html>
