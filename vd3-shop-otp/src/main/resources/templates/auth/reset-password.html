<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head><body><div th:replace="~{layouts/layout :: page(~{::section})}"><section><div class="auth-card"><h1>Đặt lại mật khẩu</h1><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err:${#fields.globalErrors()}" th:text="${err}"></p></div><label for="email">Email</label><input id="email" type="email" th:field="*{email}" required ><small class="error-text" th:errors="*{email}"></small><label for="otp">OTP 6 chữ số</label><input id="otp" type="text" th:field="*{otp}" required maxlength="6" inputmode="numeric"><small class="error-text" th:errors="*{otp}"></small><label for="password">Mật khẩu mới</label><input id="password" type="password" th:field="*{password}" required ><small class="error-text" th:errors="*{password}"></small><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required ><small class="error-text" th:errors="*{confirmPassword}"></small><button class="full">Đổi mật khẩu</button></form><p><a th:href="@{/login}">Quay lại đăng nhập</a></p></div></section></div></body></html>
