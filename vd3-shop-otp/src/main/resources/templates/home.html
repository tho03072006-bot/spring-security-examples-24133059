<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Dashboard')}"></head><body><div th:replace="~{layouts/layout :: page(~{::section})}"><section><p class="eyebrow">VÍ DỤ 3 / QUẢN LÝ SHOP</p><h1>Dashboard</h1><p>Đăng ký và xác thực email, quản lý người dùng và sản phẩm.</p><div class="cards"><div class="card"><p>Tổng người dùng</p><strong th:text="${userCount}"></strong></div><div class="card"><p>Tổng sản phẩm</p><strong th:text="${productCount}"></strong></div><div class="card" th:if="${signedIn}"><p>Sản phẩm của bạn</p><strong th:text="${ownProductCount}"></strong></div></div><div class="quick-links"><a class="button" th:if="${signedIn}" th:href="@{/products}">Quản lý sản phẩm</a><a class="button" th:if="${admin}" th:href="@{/users}">Quản lý người dùng</a><a class="button" th:unless="${signedIn}" th:href="@{/register}">Tạo tài khoản</a><a class="button secondary" th:unless="${signedIn}" th:href="@{/login}">Đăng nhập</a></div></section></div></body></html>
