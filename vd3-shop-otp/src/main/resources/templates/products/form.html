<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Thông tin sản phẩm')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::section})}">
    <section>
        <div class="panel form-panel">
            <h1 th:text="${mode == 'create'} ? 'Thêm sản phẩm' : 'Sửa sản phẩm'">Sản phẩm</h1>

            <!-- Dùng chung cho thêm và sửa; multipart để upload ảnh -->
            <form th:object="${productDTO}" method="post" enctype="multipart/form-data"
                  th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">
                <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <label for="name">Tên sản phẩm</label>
                <input id="name" type="text" th:field="*{name}">
                <small class="error-text" th:errors="*{name}"></small>

                <label for="description">Mô tả</label>
                <textarea id="description" th:field="*{description}" rows="5"></textarea>
                <small class="error-text" th:errors="*{description}"></small>

                <label for="price">Giá</label>
                <input id="price" type="number" th:field="*{price}" min="0" step="0.01">
                <small class="error-text" th:errors="*{price}"></small>

                <label for="image">Ảnh sản phẩm</label>
                <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/gif,image/bmp">
                <p class="note">Ảnh tối đa 10 MB. Để trống khi sửa để giữ ảnh hiện tại.</p>
                <img class="preview" th:if="${productDTO.imageUrl != null}" th:src="@{${productDTO.imageUrl}}"
                     alt="Ảnh hiện tại">

                <p>
                    <button type="submit">Lưu</button>
                    <a class="button secondary" th:href="@{/products}">Hủy</a>
                </p>
            </form>
        </div>
    </section>
</div>
</body>
</html>
