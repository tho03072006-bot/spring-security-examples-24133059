<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Quản lý người dùng')}"></head><body><div th:replace="~{layouts/layout :: page(~{::section})}"><section><h1>Quản lý người dùng</h1><div class="toolbar"><form th:action="@{/users}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên..."><label for="size">Số dòng</label><select id="size" name="size"><option th:each="n:${ {5,10,20,50} }" th:value="${n}" th:text="${n}" th:selected="${n == size}"></option></select><button>Tìm kiếm</button><a th:href="@{/users}">Xóa lọc</a></form><a class="button" th:href="@{/users/create}">+ Thêm mới</a></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Sản phẩm</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u:${users.content}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td><span class="badge" th:text="${u.roleName}"></span></td><td th:text="${u.enabled ? 'Hoạt động' : 'Chưa kích hoạt'}"></td><td th:text="${u.productCount}"></td><td><div class="actions"><a th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a><form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Xóa người dùng và toàn bộ sản phẩm của họ?')"><button class="danger-link">Xóa</button></form></div></td></tr><tr th:if="${users.empty}"><td colspan="8">Không có dữ liệu.</td></tr></tbody></table></div><div class="pagination"><a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">Trước</a><th:block th:if="${users.totalPages > 0}"><a th:each="i:${#numbers.sequence(0,users.totalPages-1)}" th:href="@{/users(page=${i},size=${size},keyword=${keyword})}" th:classappend="${i == users.number ? 'active' : ''}" th:text="${i+1}"></a></th:block><a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">Sau</a></div><p class="note" th:text="${'Tổng: ' + users.totalElements + ' bản ghi'}"></p></section></div></body></html>
