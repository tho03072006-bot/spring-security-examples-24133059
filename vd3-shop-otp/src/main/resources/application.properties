spring.application.name=vd3-shop-otp
# Đọc biến môi trường từ .env ở thư mục module hoặc thư mục gốc
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.default=sqlserver
server.port=${VD3_PORT:8083}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Thymeleaf và UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Upload ảnh sản phẩm
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Session; cookie riêng để chạy song song với ví dụ 1, 2 trên localhost
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=VD3SESSION

# Tạo tài khoản mẫu khi khởi động
app.seed=${SEED_DATA:true}
