spring.application.name=vd2-custom-login
# Đọc biến môi trường từ .env ở thư mục module hoặc thư mục gốc
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.default=sqlserver
server.port=${VD2_PORT:8082}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Thymeleaf và UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Session; cookie riêng để chạy song song với ví dụ 1, 3 trên localhost
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=VD2SESSION

# Tạo tài khoản mẫu khi khởi động
app.seed=${SEED_DATA:true}
