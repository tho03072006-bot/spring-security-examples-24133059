<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <a class="brand" th:href="@{/}">IOTSTAR SHOP</a>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Quản trị</a>
    </nav>

    <!-- Ảnh, họ tên, username, email, role lấy từ principal (CustomUserDetails) -->
    <div class="account" sec:authorize="isAuthenticated()" th:with="me=${#authentication.principal}">
        <img class="avatar" th:src="@{${me.images ?: '/images/avatar.svg'}}" alt="Ảnh đại diện">
        <div>
            <span th:text="|${me.fullName} (${me.username})|">Họ tên (username)</span>
            <span class="muted" th:text="|${me.email} · ${me.role}|">email · role</span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>
    <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Đăng nhập</a>
</header>
</body>
</html>
