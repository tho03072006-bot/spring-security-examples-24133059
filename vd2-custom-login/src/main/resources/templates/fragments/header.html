<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>
        <header class="site-header" th:fragment="header">
            <aside class="sidebar" sec:authorize="isAuthenticated()">
                <a class="brand" th:href="@{/}" aria-label="IOTSTAR SHOP — trang chủ">
                    <span class="brand-mark">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/>
                            <path d="m3 8 9 5 9-5M12 13v8M7 5.8l9 5"/>
                        </svg>
                    </span>
                    <span>
                        IOTSTAR SHOP
                        <small>
                            WORKSPACE
                        </small>
                    </span>
                </a>
                <div class="sidebar-menu">
                    <p class="nav-label">
                        KHÔNG GIAN LÀM VIỆC
                    </p>
                    <nav class="site-nav" aria-label="Điều hướng chính">
                        <a th:href="@{/}">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="7" rx="2"/>
                                <rect x="14" y="3" width="7" height="7" rx="2"/>
                                <rect x="3" y="14" width="7" height="7" rx="2"/>
                                <rect x="14" y="14" width="7" height="7" rx="2"/>
                            </svg>
                            <span>
                                Tổng quan
                            </span>
                        </a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/>
                                <path d="m8 12 3 3 5-6"/>
                            </svg>
                            <span>
                                Quản trị
                            </span>
                        </a>
                    </nav>
                </div>
                <div class="sidebar-tip">
                    <span class="tip-symbol">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/>
                            <path d="m8 12 3 3 5-6"/>
                        </svg>
                    </span>
                    <strong>
                        Không gian của bạn
                    </strong>
                    <p>
                        Thông tin tài khoản và quyền truy cập ở cùng một nơi.
                    </p>
                </div>
                <div class="account" th:with="me=${#authentication.principal}">
                    <div class="account-person">
                        <img class="avatar" th:src="@{${me.images ?: '/images/avatar.svg'}}" alt="Ảnh đại diện">
                        <div class="account-info">
                            <span class="account-name" th:text="${me.fullName}" th:title="${me.fullName}">
                            </span>
                            <span class="account-email" th:text="${me.email}" th:title="|${me.email} · ${me.username} · ${me.role}|">
                            </span>
                        </div>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button class="logout" type="submit" aria-label="Đăng xuất">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9 4H4v16h5m6-12 4 4-4 4M9 12h10"/>
                            </svg>
                            <span>
                                Đăng xuất
                            </span>
                        </button>
                    </form>
                </div>
                <p class="sidebar-footer">
                    IOTSTAR · 2026
                </p>
            </aside>
            <div class="app-topbar" sec:authorize="isAuthenticated()">
                <a class="mobile-brand" th:href="@{/}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/>
                        <path d="m3 8 9 5 9-5M12 13v8M7 5.8l9 5"/>
                    </svg>
                    <span>
                        IOTSTAR SHOP
                    </span>
                </a>
                <div class="topbar-location">
                    <span class="topbar-workspace">
                        Không gian quản lý
                    </span>
                    <span class="topbar-divider">
                        /
                    </span>
                    <strong data-page-title>
                        Tổng quan
                    </strong>
                </div>
                <div class="topbar-state">
                    <span class="status-dot">
                    </span>
                    Đã đăng nhập
                    <span class="role-label" th:text="${#authentication.principal.role == 'ROLE_ADMIN'} ? 'Quản trị viên' : 'Thành viên'">
                    </span>
                </div>
            </div>
            <div class="guest-header" sec:authorize="!isAuthenticated()">
                <a class="brand" th:href="@{/}" aria-label="IOTSTAR SHOP — trang chủ">
                    <span class="brand-mark">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/>
                            <path d="m3 8 9 5 9-5M12 13v8M7 5.8l9 5"/>
                        </svg>
                    </span>
                    <span>
                        IOTSTAR SHOP
                        <small>
                            WORKSPACE
                        </small>
                    </span>
                </a>
                <nav class="guest-nav" aria-label="Điều hướng chính">
                    <a th:href="@{/}">
                        Trang chủ
                    </a>
                </nav>
                <a class="button" th:href="@{/login}">
                    Đăng nhập
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 12h16m-6-6 6 6-6 6"/>
                    </svg>
                </a>
            </div>
        </header>
    </body>
</html>
