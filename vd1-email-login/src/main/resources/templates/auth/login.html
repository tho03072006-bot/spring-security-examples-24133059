<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::section})}">
    <section>
        <div class="auth-card">
            <p class="eyebrow">VÍ DỤ 1 / SPRING SECURITY</p>
            <h1>Đăng nhập</h1>
            <div class="alert error" th:if="${param.error}">
                Thông tin đăng nhập không đúng hoặc tài khoản chưa được kích hoạt.
            </div>
            <div class="alert success" th:if="${param.logout}">Đã đăng xuất thành công.</div>
            <div class="alert error" th:if="${param.expired}">Phiên đăng nhập đã hết hạn.</div>

            <!-- th:action tự chèn CSRF token vào form -->
            <form th:action="@{/login}" method="post">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="username" required autofocus>
                <label for="password">Mật khẩu</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button class="full" type="submit">Đăng nhập</button>
            </form>
            <p class="note">Tài khoản mẫu: admin@iotstar.vn / 123456</p>
        </div>
    </section>
</div>
</body>
</html>
