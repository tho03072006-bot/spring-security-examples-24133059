<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#6554e8">
        <link rel="stylesheet" th:href="@{/css/app.css}">
        <script defer th:src="@{/js/app.js}">
        </script>
        <title th:text="${title + ' | IOTSTAR SHOP'}">
            IOTSTAR SHOP
        </title>
    </head>
    <body>
        <div th:fragment="page(content)" class="app-shell" th:classappend="${#authorization.expression('isAuthenticated()')} ? 'signed-in' : 'guest'">
            <a class="skip-link" href="#main-content">
                Đến nội dung chính
            </a>
            <header th:replace="~{fragments/header :: header}">
            </header>
            <main id="main-content" class="site-main" tabindex="-1">
                <div class="alert success" role="status" th:if="${success}" th:text="${success}">
                </div>
                <div class="alert error" role="alert" th:if="${error}" th:text="${error}">
                </div>
                <th:block th:replace="${content}">
                </th:block>
            </main>
            <footer th:replace="~{fragments/footer :: footer}">
            </footer>
            <div th:replace="~{fragments/ui :: helpers}">
            </div>
        </div>
    </body>
</html>
