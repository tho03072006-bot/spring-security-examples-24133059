<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head('Trang chủ')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::section})}">
    <section>
        <p class="eyebrow">VÍ DỤ 1</p>
        <h1>Trang chủ IOTSTAR SHOP</h1>
        <div class="panel">
            <p sec:authorize="isAuthenticated()">
                Xin chào <strong th:text="${#authentication.principal.fullName}">User</strong>.
                Thông tin tài khoản của bạn được hiển thị trên header.
            </p>
            <p sec:authorize="!isAuthenticated()">Đăng nhập để xem thông tin tài khoản.</p>
            <p>Đăng nhập bằng email; layout ghép bằng Thymeleaf fragments.</p>
            <a class="button" sec:authorize="!isAuthenticated()" th:href="@{/login}">Đăng nhập</a>
            <a class="button" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Trang quản trị</a>
        </div>
    </section>
</div>
</body>
</html>
